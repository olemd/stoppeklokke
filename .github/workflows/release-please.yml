# SPDX-License-Identifier: AGPL-3.0-or-later
# Versioning and CHANGELOG from Conventional Commits (§11), and the
# self-hosted container image as a release artifact.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Published from this workflow because a release created with GITHUB_TOKEN
  # does not trigger other workflows.
  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.release-please.outputs.version }}
      REVISION: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Build image
        env:
          BUILDAH_FORMAT: docker
        run: |
          podman build \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg GIT_REVISION="${REVISION}" \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
      - name: Smoke test
        run: scripts/container-smoke.sh "${IMAGE}:${VERSION}"
      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman push "${IMAGE}:${VERSION}"
          podman push "${IMAGE}:latest"
