name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Stoppeklokke is single-user by design.** The multi-user story is one instance per person (fork and deploy your own). Requests and pull requests for multiple users, teams, roles or approvals will be declined. Please check this before spending effort.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
