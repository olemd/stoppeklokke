name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer (Stoppeklokke vX.Y.Z).
  - type: input
    id: browser
    attributes:
      label: Browser / device
